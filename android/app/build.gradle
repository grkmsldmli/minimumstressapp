apply plugin: 'com.android.application'

def ciBuildNumber = System.getenv('PROJECT_BUILD_NUMBER')
def resolvedVersionCode = ciBuildNumber?.matches('^[1-9][0-9]*$') ? ciBuildNumber.toInteger() : 1
def resolvedVersionName = System.getenv('APP_VERSION_NAME')?.trim() ?: '1.0.2'
def releaseSigningValues = [
    System.getenv('CM_KEYSTORE_PATH'),
    System.getenv('CM_KEYSTORE_PASSWORD'),
    System.getenv('CM_KEY_ALIAS'),
    System.getenv('CM_KEY_PASSWORD'),
]
def hasReleaseSigning = releaseSigningValues.every { it?.trim() }
def buildingReleaseOnCi = System.getenv('CI')?.toBoolean() &&
    gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

if (buildingReleaseOnCi && !hasReleaseSigning) {
    throw new GradleException(
        'Release signing is incomplete. Configure the minimumstress_upload ' +
        'Android keystore identity in Codemagic; never commit a keystore.'
    )
}

android {
    namespace = "com.minimumstress.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.minimumstress.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Codemagic's project-wide monotonically increasing build number is
        // the Play Store versionCode. Local builds retain a safe default.
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Codemagic injects these from its encrypted Code signing identity.
            // They are never stored in the repository or echoed by the build.
            if (hasReleaseSigning) {
                storeFile file(System.getenv('CM_KEYSTORE_PATH'))
                storePassword System.getenv('CM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CM_KEY_ALIAS')
                keyPassword System.getenv('CM_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    // OneSignal's FCM v1 service-account key belongs in the OneSignal
    // dashboard, not this repository. google-services.json is only needed if a
    // separate Firebase client SDK is deliberately added later.
    logger.info("google-services.json not found; Firebase client plugin not applied")
}
