name: Chat upgrade workbench
on:
  push:
    branches: [fix/chat-safety-engagement]
permissions:
  contents: read
concurrency:
  group: chat-upgrade-workbench
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read installed guidance and dependency audit
        run: |
          cat node_modules/next/dist/docs/01-app/03-api-reference/04-functions/after.md
          npm audit --omit=dev --json > /tmp/chat-audit.json || true
          cat /tmp/chat-audit.json
      - name: Pack reproducible workspace without Git credentials
        run: tar --exclude=.git --exclude='.env.local' --exclude='.env.production' --exclude='node_modules/.cache' -czf /tmp/minimumstress-chat-workbench.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: chat-workspace
          path: /tmp/minimumstress-chat-workbench.tar.gz
          retention-days: 1
          compression-level: 0
