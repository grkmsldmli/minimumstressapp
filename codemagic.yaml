# Codemagic build for the Capacitor native shell.
#
# The app is server-driven: capacitor.config.ts points at minimumstress.app, so
# the build does NOT compile the Next.js site — it only installs dependencies,
# syncs Capacitor, and builds the native app.

workflows:
  android-debug:
    name: Android debug (test build, no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      vars:
        # Minimum Stress uses app geolocation itself, but does not send device
        # location to OneSignal. Keep this consistent for sync and Gradle.
        ONESIGNAL_DISABLE_LOCATION: "true"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor (Android)
        script: npx cap sync android
      - name: Build debug APK
        script: |
          echo "=== JDKs available on this runner ==="
          /usr/libexec/java_home -V 2>&1 || true
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          echo "Using JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release:
    name: Android — signed Play AAB
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 22
      groups:
        # Secret JSON key with release-only access to this app in Play Console.
        - google_credentials
      # Upload the long-lived Play upload keystore once in Codemagic under
      # Team settings -> Code signing identities using this exact reference.
      android_signing:
        - minimumstress_upload
      vars:
        APP_VERSION_NAME: "1.0.2"
        ONESIGNAL_DISABLE_LOCATION: "true"
    scripts:
      - name: Verify release inputs
        script: |
          set -eu
          case "${PROJECT_BUILD_NUMBER:-}" in
            ""|*[!0-9]*|0)
              echo "PROJECT_BUILD_NUMBER must be a positive integer for Play versionCode."
              exit 1
              ;;
          esac
          for required in CM_KEYSTORE_PATH CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            if [ -z "$(printenv "$required")" ]; then
              echo "Missing encrypted Android signing input: $required"
              exit 1
            fi
          done
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            echo "Missing encrypted GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS for Internal testing publishing."
            exit 1
          fi
          node -e 'JSON.parse(process.env.GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS)'
          if [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "Codemagic did not fetch the configured Android keystore."
            exit 1
          fi
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor (Android)
        script: npx cap sync android
      - name: Build and verify signed AAB
        script: |
          set -eu
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew clean bundleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            --no-daemon
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB_PATH"
          SIGNATURE_OUTPUT=$("$JAVA_HOME/bin/jarsigner" -verify "$AAB_PATH" 2>&1)
          printf '%s\n' "$SIGNATURE_OUTPUT"
          printf '%s\n' "$SIGNATURE_OUTPUT" | grep -Fq "jar verified." || {
            echo "AAB signature verification failed."
            exit 1
          }
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      # The first Play release already exists. Every subsequent signed build
      # is delivered to Internal testing, never directly to production.
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  ios-release:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: minimumstress_asc
    environment:
      node: 22
      # Pin the image so a Codemagic default update cannot change the compiler
      # underneath an otherwise identical release commit.
      xcode: "26.6"
      vars:
        ONESIGNAL_DISABLE_LOCATION: "true"
      ios_signing:
        # Fetch only the capability-complete release profiles. Bundle matching
        # is intentionally avoided: Codemagic may otherwise choose an older,
        # still-valid profile that predates the shared OneSignal App Group.
        provisioning_profiles:
          - profile: minimumstress_appstore_103
            environment_variable: CM_APP_PROVISIONING_PROFILE
          - profile: minimumstress_onesignal_extension_102
            environment_variable: CM_EXTENSION_PROVISIONING_PROFILE
        certificates:
          - certificate: minimumstress_distribution_101
            environment_variable: CM_DISTRIBUTION_CERTIFICATE
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor (iOS)
        script: npx cap sync ios
      - name: Apply uploaded signing files
        script: |
          xcode-project use-profiles
      - name: Verify Apple capabilities in provisioning
        script: |
          set -e
          APP_PROFILE_PATH="${CM_APP_PROVISIONING_PROFILE:-}"
          EXTENSION_PROFILE_PATH="${CM_EXTENSION_PROVISIONING_PROFILE:-}"
          if [ -z "$APP_PROFILE_PATH" ] || [ ! -f "$APP_PROFILE_PATH" ]; then
            echo "Codemagic did not fetch minimumstress_appstore_103."
            exit 1
          fi
          if [ -z "$EXTENSION_PROFILE_PATH" ] || [ ! -f "$EXTENSION_PROFILE_PATH" ]; then
            echo "Codemagic did not fetch minimumstress_onesignal_extension_102."
            exit 1
          fi

          security cms -D -i "$APP_PROFILE_PATH" > /tmp/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist 2>/dev/null || true)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist 2>/dev/null || true)
          echo "Provisioning profile: $PROFILE_NAME"
          echo "Provisioning UUID: $PROFILE_UUID"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' /tmp/profile.plist >/dev/null 2>&1 || {
            echo "Selected provisioning profile does not contain the Sign in with Apple entitlement."
            exit 1
          }
          APNS_ENV=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' /tmp/profile.plist 2>/dev/null || true)
          if [ "$APNS_ENV" != "production" ]; then
            echo "Selected provisioning profile must contain aps-environment=production. Regenerate it after enabling Push Notifications for com.minimumstress.app."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' /tmp/profile.plist \
            | grep -F 'group.com.minimumstress.app.onesignal' >/dev/null || {
            echo "Selected app profile must contain the OneSignal App Group. Enable group.com.minimumstress.app.onesignal and regenerate it."
            exit 1
          }

          security cms -D -i "$EXTENSION_PROFILE_PATH" > /tmp/extension-profile.plist
          EXTENSION_APPLICATION_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/extension-profile.plist 2>/dev/null || true)
          case "$EXTENSION_APPLICATION_ID" in
            *.com.minimumstress.app.OneSignalNotificationServiceExtension) ;;
            *)
              echo "The pinned extension profile has the wrong application identifier."
              exit 1
              ;;
          esac
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' /tmp/extension-profile.plist \
            | grep -F 'group.com.minimumstress.app.onesignal' >/dev/null || {
            echo "The pinned extension profile does not contain the shared OneSignal App Group."
            exit 1
          }
          echo "Sign in with Apple entitlement: present"
          echo "APNs push entitlement: present"
          echo "OneSignal App Group and extension profile: present"
      - name: Release version and unique build number
        script: |
          cd ios/App
          agvtool new-marketing-version "1.0.2"
          agvtool new-version -all "$(date +%s)"
      - name: Build the signed IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
