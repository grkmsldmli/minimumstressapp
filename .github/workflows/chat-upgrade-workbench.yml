name: Apply chat safety upgrade
on:
  push:
    branches: [fix/chat-safety-engagement]
permissions:
  contents: write
concurrency:
  group: chat-upgrade-apply
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-safety-engagement
          fetch-depth: 0
      - name: Apply verified patch and clean workbench
        shell: bash
        run: |
          set -euo pipefail
          cat .chat-patch/part1 .chat-patch/part2 .chat-patch/part3 .chat-patch/part4 | base64 -d | gunzip > /tmp/chat.patch
          git apply -p1 --whitespace=nowarn /tmp/chat.patch
          rm -rf .chat-patch
          git rm .github/workflows/chat-upgrade-workbench.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden chat, reviews, notifications, and consent"
          git push origin HEAD:fix/chat-safety-engagement
