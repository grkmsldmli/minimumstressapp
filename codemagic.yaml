# Codemagic build for the Capacitor native shell.
#
# The app is server-driven: capacitor.config.ts points at minimumstress.app, so
# the build does NOT compile the Next.js site — it only installs dependencies,
# syncs Capacitor, and builds the native app.

workflows:
  android-debug:
    name: Android debug (test build, no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      vars:
        # Minimum Stress uses app geolocation itself, but does not send device
        # location to OneSignal. Keep this consistent for sync and Gradle.
        ONESIGNAL_DISABLE_LOCATION: "true"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor (Android)
        script: npx cap sync android
      - name: Build debug APK
        script: |
          echo "=== JDKs available on this runner ==="
          /usr/libexec/java_home -V 2>&1 || true
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          echo "Using JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk

  android-release:
    name: Android — signed Play AAB
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 22
      # Upload the long-lived Play upload keystore once in Codemagic under
      # Team settings -> Code signing identities using this exact reference.
      android_signing:
        - minimumstress_upload
      vars:
        APP_VERSION_NAME: "1.0.1"
        ONESIGNAL_DISABLE_LOCATION: "true"
    scripts:
      - name: Verify release inputs
        script: |
          set -eu
          case "${PROJECT_BUILD_NUMBER:-}" in
            ""|*[!0-9]*|0)
              echo "PROJECT_BUILD_NUMBER must be a positive integer for Play versionCode."
              exit 1
              ;;
          esac
          for required in CM_KEYSTORE_PATH CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            if [ -z "$(printenv "$required")" ]; then
              echo "Missing encrypted Android signing input: $required"
              exit 1
            fi
          done
          if [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "Codemagic did not fetch the configured Android keystore."
            exit 1
          fi
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor (Android)
        script: npx cap sync android
      - name: Build and verify signed AAB
        script: |
          set -eu
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          "$JAVA_HOME/bin/java" -version
          cd android
          chmod +x ./gradlew
          ./gradlew clean bundleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            --no-daemon
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB_PATH"
          SIGNATURE_OUTPUT=$("$JAVA_HOME/bin/jarsigner" -verify "$AAB_PATH" 2>&1)
          printf '%s\n' "$SIGNATURE_OUTPUT"
          printf '%s\n' "$SIGNATURE_OUTPUT" | grep -Fq "jar verified." || {
            echo "AAB signature verification failed."
            exit 1
          }
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    # Google requires the first version to be uploaded manually. Download the
    # signed AAB artifact and upload it to Internal testing in Play Console.
    # Add google_play publishing only after that first Play version exists.

  ios-release:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: minimumstress_asc
    environment:
      node: 22
      xcode: latest
      vars:
        ONESIGNAL_DISABLE_LOCATION: "true"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.minimumstress.app
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor (iOS)
        script: npx cap sync ios
      - name: Apply uploaded signing files
        script: |
          xcode-project use-profiles
      - name: Verify Apple capabilities in provisioning
        script: |
          set -e
          PROFILE_PATH="${CM_PROVISIONING_PROFILE:-}"
          if [ -z "$PROFILE_PATH" ]; then
            PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -type f -name '*.mobileprovision' 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$PROFILE_PATH" ] || [ ! -f "$PROFILE_PATH" ]; then
            echo "No provisioning profile was fetched by Codemagic. Upload the App Store profile for com.minimumstress.app under Code signing identities."
            exit 1
          fi
          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist 2>/dev/null || true)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist 2>/dev/null || true)
          echo "Provisioning profile: $PROFILE_NAME"
          echo "Provisioning UUID: $PROFILE_UUID"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' /tmp/profile.plist >/dev/null 2>&1 || {
            echo "Selected provisioning profile does not contain the Sign in with Apple entitlement."
            exit 1
          }
          APNS_ENV=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' /tmp/profile.plist 2>/dev/null || true)
          if [ "$APNS_ENV" != "production" ]; then
            echo "Selected provisioning profile must contain aps-environment=production. Regenerate it after enabling Push Notifications for com.minimumstress.app."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' /tmp/profile.plist \
            | grep -F 'group.com.minimumstress.app.onesignal' >/dev/null || {
            echo "Selected app profile must contain the OneSignal App Group. Enable group.com.minimumstress.app.onesignal and regenerate it."
            exit 1
          }

          EXTENSION_PROFILE_FOUND=false
          for CANDIDATE in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision; do
            [ -f "$CANDIDATE" ] || continue
            security cms -D -i "$CANDIDATE" > /tmp/candidate-profile.plist
            APPLICATION_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/candidate-profile.plist 2>/dev/null || true)
            case "$APPLICATION_ID" in
              *.com.minimumstress.app.OneSignalNotificationServiceExtension)
                /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' /tmp/candidate-profile.plist \
                  | grep -F 'group.com.minimumstress.app.onesignal' >/dev/null || continue
                EXTENSION_PROFILE_FOUND=true
                break
                ;;
            esac
          done
          if [ "$EXTENSION_PROFILE_FOUND" != "true" ]; then
            echo "No App Store profile was found for com.minimumstress.app.OneSignalNotificationServiceExtension with the shared OneSignal App Group."
            exit 1
          fi
          echo "Sign in with Apple entitlement: present"
          echo "APNs push entitlement: present"
          echo "OneSignal App Group and extension profile: present"
      - name: Release version and unique build number
        script: |
          cd ios/App
          agvtool new-marketing-version "1.0.2"
          agvtool new-version -all "$(date +%s)"
      - name: Build the signed IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
