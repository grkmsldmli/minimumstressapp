# Codemagic build for the Capacitor native shell.
#
# The app is server-driven: capacitor.config.ts points at minimumstress.app, so
# the build does NOT compile the Next.js site — it only installs dependencies,
# syncs Capacitor (which copies the mobile/www fallback and wires the native
# projects), and builds the native app.
#
# Start with `android-debug`: it needs no signing, produces an installable APK
# to test on a device, and proves the whole thing compiles. `ios-release` and a
# signed Android release come once the Apple Developer and Play accounts are
# verified and their signing is connected in the Codemagic UI.

workflows:
  android-debug:
    name: Android debug (test build, no signing)
    # macOS M2 is the instance the free plan provides; Android builds run on it
    # fine (the Android SDK is preinstalled). linux_x2 needs a paid plan.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor (Android)
        script: npx cap sync android
      - name: Build debug APK
        script: |
          # Capacitor 8's Android library compiles at Java 21. Show what the
          # runner has, select JDK 21, and force Gradle to use that exact JDK
          # (not just the ambient JAVA_HOME) with no reused daemon.
          echo "=== JDKs available on this runner ==="
          /usr/libexec/java_home -V 2>&1 || true
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          echo "Using JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          cd android
          # gradlew is committed from Windows without the executable bit, so the
          # macOS runner can't run it directly. Grant it here.
          chmod +x ./gradlew
          ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-release:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # Add an App Store Connect API key in Codemagic (Teams or App settings →
      # Integrations → App Store Connect) and name it EXACTLY this. It carries
      # the .p8 key, the Key ID and the Issuer ID, and is what lets Codemagic
      # sign the build and upload it to TestFlight.
      app_store_connect: minimumstress_asc
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        # Automatic signing: Codemagic fetches (or creates) the distribution
        # certificate and the provisioning profile for this bundle id through
        # the API key above — no certificates to upload by hand.
        distribution_type: app_store
        bundle_identifier: com.minimumstress.app
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor and install pods
        script: |
          npx cap sync ios
          cd ios/App && pod install
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Unique build number
        # A timestamp guarantees each TestFlight upload gets a higher build
        # number than the last, without having to look the previous one up.
        script: |
          cd ios/App
          agvtool new-version -all "$(date +%s)"
      - name: Build the signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Straight to TestFlight so it can be installed on a device; App Store
        # review is a separate, later step.
        submit_to_testflight: true
